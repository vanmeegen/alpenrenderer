<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#bfd9f2">
<title>Spike: Zugspitze 3D (Mapterhorn, WebGL)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfd9f2; font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px;
         display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .card { background: rgba(255,255,255,.82); backdrop-filter: blur(6px); border-radius: 8px;
          padding: 6px 10px; max-width: 420px; pointer-events: auto; color: #222; }
  .card b { font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  a { color: #0b57d0; text-decoration: none; }
  a.sel { font-weight: 700; text-decoration: underline; }
  #status { color: #444; }
  #sources { font-size: 12px; color: #333; }
  #err { color: #b00020; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="hud">
  <div class="card">
    <div class="row"><b id="title">Zugspitze</b><span id="status">lade…</span><span id="fps"></span></div>
    <div class="row">Mesh:
      <a href="#" data-mesh="384">384²</a> <a href="#" data-mesh="512">512²</a>
      <a href="#" data-mesh="768">768²</a> <a href="#" data-mesh="1024">1024²</a>
      · Ort: <a href="?p=zugspitze">Zugspitze</a> <a href="?p=grossglockner">Großglockner</a>
      <a href="?p=matterhorn">Matterhorn</a> <a href="?p=watzmann">Watzmann</a>
    </div>
    <div id="sources">Quellen: …</div>
    <div id="err"></div>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "pmtiles": "https://cdn.jsdelivr.net/npm/pmtiles@4.3.0/+esm"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PMTiles } from 'pmtiles';

// ------------------------------------------------------------------ Setup
const PLACES = {
  zugspitze:     { name: 'Zugspitze (DE/AT)',        lon: 10.98527, lat: 47.42111 },
  grossglockner: { name: 'Großglockner (AT)',        lon: 12.69444, lat: 47.07444 },
  matterhorn:    { name: 'Matterhorn (CH/IT)',       lon: 7.65862,  lat: 45.97639 },
  watzmann:      { name: 'Watzmann (DE/AT)',         lon: 12.92222, lat: 47.55472 },
};
const q = new URLSearchParams(location.search);
const place = PLACES[q.get('p')] ?? PLACES.zugspitze;
const center = { lon: +(q.get('lon') ?? place.lon), lat: +(q.get('lat') ?? place.lat) };
const Z = +(q.get('z') ?? 12);              // Mapterhorn tile zoom, 512 px tiles
const WIN = +(q.get('win') ?? 1536);        // window edge in Mercator pixels
const TILE = 512;
const isPhone = Math.min(innerWidth, innerHeight) < 600;
const MESH = +(q.get('mesh') ?? (isPhone ? 512 : 768));
// Tile base URL; override with ?tiles=… for a local cache or another server.
const TILES = q.get('tiles') ?? 'https://tiles.mapterhorn.com/';

const $ = (id) => document.getElementById(id);
$('title').textContent = place.name;
for (const a of document.querySelectorAll('a[data-mesh]')) {
  if (+a.dataset.mesh === MESH) a.classList.add('sel');
  a.onclick = (e) => { e.preventDefault(); q.set('mesh', a.dataset.mesh); location.search = q.toString(); };
}
const fail = (m) => { $('err').textContent += m + '\n'; };
addEventListener('error', (e) => fail(e.message));
addEventListener('unhandledrejection', (e) => fail(String(e.reason)));

// ----------------------------------------------------------- Web Mercator
const DEG = Math.PI / 180;
const n = TILE * 2 ** Z;                                     // pixels around the globe
const mercX = (lon) => (lon + 180) / 360 * n;
const mercY = (lat) => (1 - Math.log(Math.tan(lat * DEG) + 1 / Math.cos(lat * DEG)) / Math.PI) / 2 * n;
const mpp = 156543.03392804097 * Math.cos(center.lat * DEG) / 2 ** Z / (TILE / 256); // metres per pixel
const cx = mercX(center.lon), cy = mercY(center.lat);
const px0 = Math.round(cx - WIN / 2), py0 = Math.round(cy - WIN / 2);

// ----------------------------------------------------------- Tile loading
// The heights stay terrarium-encoded RGB in one big canvas; the shaders decode.
// That avoids float textures entirely, which is the safe path on iOS.
const cv = document.createElement('canvas');
cv.width = WIN; cv.height = WIN;
const ctx = cv.getContext('2d', { willReadFrequently: true });

function loadImage(url) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('Tile fehlgeschlagen: ' + url));
    im.src = url;
  });
}

const keys = [];
for (let ty = Math.floor(py0 / TILE); ty <= Math.floor((py0 + WIN - 1) / TILE); ty++)
  for (let tx = Math.floor(px0 / TILE); tx <= Math.floor((px0 + WIN - 1) / TILE); tx++)
    keys.push({ z: Z, x: tx, y: ty });

let loaded = 0, bytes = 0;
const status = (s) => { $('status').textContent = s; };
async function loadTiles() {
  await Promise.all(keys.map(async (k) => {
    const im = await loadImage(`${TILES}${k.z}/${k.x}/${k.y}.webp`);
    ctx.drawImage(im, k.x * TILE - px0, k.y * TILE - py0);
    loaded++;
    status(`Tiles ${loaded}/${keys.length}`);
  }));
}

// Height at a window pixel, from the composited canvas (CPU side, for the camera target).
function heightAt(px, py) {
  const d = ctx.getImageData(Math.max(0, Math.min(WIN - 1, px)), Math.max(0, Math.min(WIN - 1, py)), 1, 1).data;
  return d[0] * 256 + d[1] + d[2] / 256 - 32768;
}

// ----------------------------------------------------------- Attribution
// Mapterhorn's coverage index says which surveys are under each z12 cell.
async function loadSources() {
  try {
    const p = new PMTiles('https://download.mapterhorn.com/coverage-index.pmtiles');
    const all = {};
    const cells = new Set(keys.map((k) => {
      const s = k.z - 12;
      return s >= 0 ? `${k.x >> s}/${k.y >> s}` : `${k.x << -s}/${k.y << -s}`;
    }));
    await Promise.all([...cells].map(async (c) => {
      const [x, y] = c.split('/').map(Number);
      const t = await p.getZxy(12, x, y);
      if (t) Object.assign(all, JSON.parse(new TextDecoder().decode(t.data)));
    }));
    const list = Object.values(all).sort((a, b) => a.resolution - b.resolution);
    const seen = new Set();
    const html = list.filter((s) => !seen.has(s.producer_short) && seen.add(s.producer_short))
      .map((s) => `<a href="${s.website}" target="_blank" rel="noopener">© ${s.producer_short}</a> (${s.resolution} m)`);
    $('sources').innerHTML = 'Quellen: ' + html.join(' · ')
      + ' · <a href="https://mapterhorn.com/attribution" target="_blank" rel="noopener">© Mapterhorn</a>';
  } catch (e) {
    $('sources').innerHTML = 'Quellen: <a href="https://mapterhorn.com/attribution" target="_blank" rel="noopener">© Mapterhorn</a> (Index nicht ladbar)';
  }
}

// ----------------------------------------------------------- Rendering
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const SKY = new THREE.Color(0xbfd9f2);
const scene = new THREE.Scene();
scene.background = SKY;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 5, 250000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.minDistance = 300;
controls.maxDistance = 60000;
controls.maxPolarAngle = 88 * DEG;   // never below the ground plane
controls.screenSpacePanning = false;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

const VERT = /* glsl */`
precision highp float;
uniform sampler2D uHeights;
uniform vec2 uWin;        // window size in pixels
uniform float uMpp;
varying vec2 vUv;
varying vec3 vPos;
float decode(vec4 c) { return c.r * 65280.0 + c.g * 255.0 + c.b * 255.0 / 256.0 - 32768.0; }
void main() {
  vUv = uv;
  // Sample the texel centre exactly; vertices sit on texel centres by construction.
  ivec2 t = ivec2(clamp(uv * uWin, vec2(0.0), uWin - 1.0));
  float h = decode(texelFetch(uHeights, t, 0));
  vec3 p = vec3(position.x, h, position.z);
  vPos = p;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;

const FRAG = /* glsl */`
precision highp float;
uniform sampler2D uHeights;
uniform vec2 uWin;
uniform float uMpp;
uniform vec3 uSun;
uniform vec3 uSky;
uniform vec3 uEye;
varying vec2 vUv;
varying vec3 vPos;
out vec4 outColor;
float decode(vec4 c) { return c.r * 65280.0 + c.g * 255.0 + c.b * 255.0 / 256.0 - 32768.0; }
float h(ivec2 t) { return decode(texelFetch(uHeights, clamp(t, ivec2(0), ivec2(uWin) - 1), 0)); }
void main() {
  ivec2 t = ivec2(clamp(vUv * uWin, vec2(0.0), uWin - 1.0));
  // Central differences on the full-resolution DEM: shading stays crisp even
  // where the mesh is coarser than the data.
  float dx = (h(t + ivec2(1, 0)) - h(t - ivec2(1, 0))) / (2.0 * uMpp);
  float dz = (h(t + ivec2(0, 1)) - h(t - ivec2(0, 1))) / (2.0 * uMpp);
  vec3 nrm = normalize(vec3(-dx, 1.0, -dz));
  float slope = 1.0 - nrm.y;                 // 0 flat .. 1 vertical
  float alt = vPos.y;

  // Hypsometric tint with slope-dependent rock and snow.
  vec3 valley = vec3(0.47, 0.60, 0.33);
  vec3 forest = vec3(0.28, 0.43, 0.24);
  vec3 meadow = vec3(0.58, 0.60, 0.38);
  vec3 rock   = vec3(0.52, 0.50, 0.47);
  vec3 snow   = vec3(0.94, 0.96, 0.99);
  vec3 col = mix(valley, forest, smoothstep(700.0, 1100.0, alt));
  col = mix(col, meadow, smoothstep(1500.0, 1900.0, alt));
  col = mix(col, rock, smoothstep(1900.0, 2300.0, alt));
  col = mix(col, rock, smoothstep(0.35, 0.6, slope) * 0.85);
  float snowy = smoothstep(2450.0, 2900.0, alt) * (1.0 - smoothstep(0.45, 0.7, slope));
  col = mix(col, snow, snowy);

  // Lambert with a soft sky term.
  float diff = max(dot(nrm, uSun), 0.0);
  float shade = 0.28 + 0.72 * diff;
  col *= shade;

  // Aerial perspective.
  float d = distance(vPos, uEye);
  float fog = 1.0 - exp(-d / 45000.0);
  col = mix(col, uSky, fog * 0.85);
  outColor = vec4(col, 1.0);
}`;

const uniforms = {
  uHeights: { value: null },
  uWin: { value: new THREE.Vector2(WIN, WIN) },
  uMpp: { value: mpp },
  uSun: { value: new THREE.Vector3(-0.5, 0.75, 0.45).normalize() },   // from the south-west, 45° up
  uSky: { value: SKY },
  uEye: { value: new THREE.Vector3() },
};

function buildGrid(segs) {
  // Vertices at texel centres of a segs×segs subsample of the window; x east, z south, y up.
  const geo = new THREE.BufferGeometry();
  const N = segs;
  const pos = new Float32Array(N * N * 3);
  const uv = new Float32Array(N * N * 2);
  const half = WIN / 2;
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const px = (i + 0.5) * (WIN / N), py = (j + 0.5) * (WIN / N);   // window pixel
      const k = j * N + i;
      pos[k * 3] = (px - half) * mpp;
      pos[k * 3 + 1] = 0;
      pos[k * 3 + 2] = (py - half) * mpp;
      uv[k * 2] = px / WIN;
      uv[k * 2 + 1] = py / WIN;
    }
  }
  const idx = new Uint32Array((N - 1) * (N - 1) * 6);
  let o = 0;
  for (let j = 0; j < N - 1; j++) {
    for (let i = 0; i < N - 1; i++) {
      const a = j * N + i, b = a + 1, c = a + N, d = c + 1;
      idx[o++] = a; idx[o++] = c; idx[o++] = b;
      idx[o++] = b; idx[o++] = c; idx[o++] = d;
    }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 2000, 0), WIN * mpp);
  return geo;
}

let frames = 0, tFps = performance.now();
function loop() {
  controls.update();
  uniforms.uEye.value.copy(camera.position);
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - tFps > 1000) {
    $('fps').textContent = `${Math.round(frames * 1000 / (now - tFps))} fps`;
    frames = 0; tFps = now;
  }
  requestAnimationFrame(loop);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

async function main() {
  const gl = renderer.getContext();
  if (!(gl instanceof WebGL2RenderingContext)) throw new Error('WebGL2 wird benötigt.');
  status(`Tiles 0/${keys.length}`);
  const t0 = performance.now();
  await Promise.all([loadTiles(), loadSources()]);
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.flipY = false;
  tex.colorSpace = THREE.NoColorSpace;
  uniforms.uHeights.value = tex;

  // GLSL ES 3.0 for texelFetch; three maps varying/attribute to in/out itself,
  // but the fragment output has to be declared by us in this mode.
  const mat = new THREE.ShaderMaterial({ uniforms, vertexShader: VERT, fragmentShader: FRAG, glslVersion: THREE.GLSL3 });
  const mesh = new THREE.Mesh(buildGrid(MESH), mat);
  mesh.frustumCulled = false;
  scene.add(mesh);

  // Camera target on the summit, eye south-east of it and above.
  const sx = cx - px0, sy = cy - py0;
  let hs = -1e9;
  for (let dy = -6; dy <= 6; dy++) for (let dx = -6; dx <= 6; dx++) hs = Math.max(hs, heightAt(Math.round(sx) + dx, Math.round(sy) + dy));
  const target = new THREE.Vector3((sx - WIN / 2) * mpp, hs, (sy - WIN / 2) * mpp);
  controls.target.copy(target);
  camera.position.set(target.x + 5000, hs + 2500, target.z + 7000);
  camera.lookAt(target);
  controls.update();

  const ms = Math.round(performance.now() - t0);
  status(`${keys.length} Tiles · ${(WIN * mpp / 1000).toFixed(0)} km Fenster · ${mpp.toFixed(1)} m/px · Gipfel ${Math.round(hs)} m · Mesh ${MESH}² · ${ms} ms`);
  loop();
}
main().catch((e) => { fail(e.message); status('Fehler'); });
</script>
</body>
</html>
