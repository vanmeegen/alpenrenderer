name: CI

# Once per commit: pushes to main, and pull requests for everything else.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck and unit tests
        run: bun run check
      - name: Build
        run: bun run build
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      - name: End-to-end tests (synthetic terrain, no network)
        run: bun run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
